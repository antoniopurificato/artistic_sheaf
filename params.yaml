 # ---- Training ----
  batch_size:
    values: [512, 256, 128]

  lr:
    values: [0.001, 0.0001, 0.00001]

  optimizer:
    values: [Adam, AdamW, SGD]

  # ---- Model dimensions ----
  latent_dim:
    values: [512, 256, 128] #non puoi mettere latent_dim 512 se le immagini hanno shape 256

  finetune_layers:
    values: [1, 3, 6]

  sheaf_layers:
    values: [1, 3, 5]

  alpha:
    values: [1.2, 1.5, 1.7]

  weights_components:
    values: [1, 0] #0.7, 0.5, 0.3,

  weights_kl_vs_clip:
    values: [1, 0] # 0.7, 0.5, 0.3,

  w_clip_vs_mask:
    values: [1, 0] #0.7, 0.5, 0.3,

  test:
    values: [False]
    
  out_proj: 
    values: [True]

  laplacian_heat_kernel:
    values: [False, True]

